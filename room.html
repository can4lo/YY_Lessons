<script type="module">

// ====== ГЕНЕРАЦИЯ ТЕКСТУРЫ ПАРКЕТА (Canvas) ======
function createParquetTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#e6a55e';
  ctx.fillRect(0, 0, 512, 512);

  const blockSize = 64;
  for (let y = 0; y < 512; y += blockSize) {
    for (let x = 0; x < 512; x += blockSize) {
      const isVertical = ((x / blockSize) + (y / blockSize)) % 2 === 0;
      ctx.save();
      ctx.translate(x + blockSize/2, y + blockSize/2);
      if (!isVertical) ctx.rotate(Math.PI / 2);
      ctx.translate(-(x + blockSize/2), -(y + blockSize/2));

      const shade = Math.random() * 30 - 15;
      ctx.fillStyle = `rgb(${230 + shade}, ${165 + shade}, ${94 + shade})`;
      ctx.fillRect(x + 2, y + 2, blockSize - 4, blockSize - 4);

      ctx.strokeStyle = 'rgba(139, 69, 19, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const ly = y + 8 + i * 9;
        ctx.beginPath();
        ctx.moveTo(x + 4, ly);
        ctx.lineTo(x + blockSize - 4, ly + (Math.random() * 3 - 1.5));
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(4, 4);
  return texture;
}

// ====== СЦЕНА ======
const scene = new THREE.Scene();

renderer.shadowMap.enabled = true;

// ====== УПРАВЛЕНИЕ ======

controls.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,

  RIGHT: THREE.MOUSE.PAN
};

// ====== КОМНАТА ======

const ROOM_D = 10;

function makeWall(w, h, d, x, y, z, material, group) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);
  return mesh;
}

const wallThickness = 0.2;

makeWall(wallThickness, ROOM_H, ROOM_D, -ROOM_W/2, ROOM_H/2, 0, mat.wall, walls.left);
makeWall(wallThickness, ROOM_H, ROOM_D, ROOM_W/2, ROOM_H/2, 0, mat.wall, walls.right);

const garlandLights = [];
const garlandGroup = new THREE.Group();
const lightColors = [0xff3333, 0x33ff55, 0x3388ff, 0xffee33, 0xff33cc];

function createGarland() {
  const spacing = 0.7;
  const y = ROOM_H - 0.25;
  const offset = 0.15;
  let index = 0;

  const addLight = (x, z) => {
    const color = lightColors[index % lightColors.length];
    const geo = new THREE.SphereGeometry(0.07, 8, 8);
    const lMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.0, toneMapped: false });
    const mesh = new THREE.Mesh(geo, lMat);
    mesh.position.set(x, y, z);
    garlandGroup.add(mesh);
    garlandLights.push({ mesh, offset: index * 0.4 });
    index++;
  };

  for (let x = -ROOM_W/2 + offset; x <= ROOM_W/2 - offset; x += spacing) addLight(x, -ROOM_D/2 + offset);
  for (let z = -ROOM_D/2 + offset; z <= ROOM_D/2 - offset; z += spacing) addLight(ROOM_W/2 - offset, z);
  for (let x = ROOM_W/2 - offset; x >= -ROOM_W/2 + offset; x -= spacing) addLight(x, ROOM_D/2 - offset);
  for (let z = ROOM_D/2 - offset; z >= -ROOM_D/2 + offset; z -= spacing) addLight(-ROOM_W/2 + offset, z);

  roomGroup.add(garlandGroup);
}
createGarland();

const desk = new THREE.Group();

// --- КОМПЬЮТЕР ---

const led = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.02), mat.lamp);
led.position.set(-1.3, 1.5, 0.46); pc.add(led);

shelves.position.set(2.5, 0, -4.7);

// --- ФУНКЦИЯ ДЛЯ СОЗДАНИЯ РАСТЕНИЙ ---
function createPlant(x, z, scale = 1) {
  const plantGroup = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.3 * scale, 0.2 * scale, 0.5 * scale, 16), mat.pot);
  pot.position.set(0, 0.25 * scale, 0);
  pot.castShadow = true;
  plantGroup.add(pot);
  
  for (let i = 0; i < 6; i++) {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.25 * scale, 8, 8), mat.plant);
    const a = (i / 6) * Math.PI * 2;
    leaf.position.set(Math.cos(a) * 0.2 * scale, (0.7 + Math.random() * 0.2) * scale, Math.sin(a) * 0.2 * scale);
    leaf.scale.set(1, 1.3, 1);
    leaf.castShadow = true;
    plantGroup.add(leaf);
  }
  const topLeaf = new THREE.Mesh(new THREE.SphereGeometry(0.3 * scale, 8, 8), mat.plant);
  topLeaf.position.set(0, 1.0 * scale, 0);
  topLeaf.castShadow = true;
  plantGroup.add(topLeaf);
  
  plantGroup.position.set(x, 0, z);
  roomGroup.add(plantGroup);
}

windowLight.position.set(-4, 3, 0);
scene.add(windowLight);

// ====== РЕЖИМЫ СТЕН ======
function setWallMode(mode) {
  walls.back.visible  = (mode === 'all' || mode === 'back');
  walls.left.visible  = (mode === 'all');
  walls.right.visible = (mode === 'all');
  walls.front.visible = (mode === 'all');
  garlandGroup.visible = (mode === 'all' || mode === 'back');
}

document.querySelectorAll('#ui button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setWallMode(btn.dataset.mode);
  });
});

// ====== АНИМАЦИЯ ======
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  
  // Мерцание экранов (и монитора, и нового телевизора, так как используют один материал)
  mat.screen.emissiveIntensity = 0.5 + Math.sin(Date.now() * 0.003) * 0.15;

  // Анимация мигания гирлянды
  const time = Date.now() * 0.004;
  garlandLights.forEach((light) => {
    const blink = Math.sin(time + light.offset) * 0.5 + 0.5;
    light.mesh.material.emissiveIntensity = 0.3 + blink * 1.2;
  });

  renderer.render(scene, camera);
}
animate();

// ====== RESIZE ======
window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -d * a;
  camera.right = d * a;
  camera.top = d;
  camera.bottom = -d;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
